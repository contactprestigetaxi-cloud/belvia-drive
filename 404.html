<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>404</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0b;
      --text: #f4f1ea;
      --muted: #b7b0a2;
      --line: rgba(244, 241, 234, .14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    main {
      width: min(92vw, 440px);
      padding: 32px 24px;
      border: 1px solid var(--line);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Site temporairement indisponible.</p>
  </main>
</body>
</html>
